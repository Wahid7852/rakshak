// Defines the RAKSHAK decider gRPC service contract.
syntax = "proto3";
package rakshak.decider.v1;

// ---------- Core unified event ----------

message Event {
  enum Kind { LOG = 0; FILE = 1; }
  Kind kind = 1;
  string text = 2;                     // for logs
  bytes bytes = 3;                     // for files (small payloads)
  string path = 4;                     // optional file path hint
  map<string, string> context = 5;     // extra hints (pid, mime, user, ...)
}

message Decision {
  double score = 1;
  double confidence = 2;
  string verdict = 3;                  // "malicious" | "benign" | "unknown"
  string used = 4;                     // detector or fuse used
}

message DecideRequest  { Event event = 1; }
message DecideResponse { Decision decision = 1; }

// ---------- Log streaming ----------

message LogLine {
  string id = 1;                       // caller-provided correlation id
  string text = 2;
  map<string, string> context = 3;
}

message LogDecision {
  string id = 1;
  Decision decision = 2;
}

// ---------- NEW: File streaming upload ----------

message FileChunk {
  bytes data = 1;                      // raw bytes chunk
  string path = 2;                     // optional path hint (first chunk)
  uint64 offset = 3;                   // running offset
  bool eof = 4;                        // last chunk?
  map<string,string> context = 5;      // extra hints (mime, user, pid)
}

// ---------- Service ----------

service Decider {
  // Unary
  rpc Decide(DecideRequest) returns (DecideResponse);

  // Bi-di streaming for logs
  rpc StreamLogs(stream LogLine) returns (stream LogDecision);

  // NEW: streaming file upload with early decision
  rpc UploadAndDecide(stream FileChunk) returns (DecideResponse);
}
